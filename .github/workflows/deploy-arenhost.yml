
name: Deploy Astro to ArenHost

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arenhost-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro website
        env:
          SITE_URL: https://agung-labs.my.id
          BASE_PATH: /
        run: npm run build

      - name: Test FTPS deployment (dry run)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.ARENHOST_FTP_SERVER }}
          username: ${{ secrets.ARENHOST_FTP_USERNAME }}
          password: ${{ secrets.ARENHOST_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ./
          dry-run: true
          security: strict
          log-level: verbose
